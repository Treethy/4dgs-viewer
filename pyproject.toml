[project]
name = "viewer4d"
version = "0.1.0"
description = "Interactive viewer for dynamic 4D Gaussian Splatting models"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "gsplat==1.5.3",
    "ninja>=1.11,<2",
    "numpy>=1.26,<2",
    "pillow>=10,<13",
    "setuptools>=70",
    "torch==2.7.1",
    "viser==1.0.30",
]

[project.scripts]
viewer4d = "viewer4d:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
